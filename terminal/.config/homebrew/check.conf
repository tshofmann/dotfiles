# ============================================================
# check.conf - Homebrew Outdated-Check Konfiguration
# ============================================================
# Zweck       : Einstellungen für automatische Paket-Prüfung
# Pfad        : ~/.config/homebrew/check.conf
# Hinweis     : Geladen von ~/.config/alias/brew.alias
#               State: ${XDG_STATE_HOME:-~/.local/state}/homebrew (maschinenlokal)
# ============================================================

# Prüf-Intervall in Sekunden (Standard: 43200 = 12h)
_BREW_CHECK_INTERVAL=43200

# Benachrichtigungskanal: auto | desktop | terminal | off
# auto     = Desktop-Notification wenn verfügbar, sonst Terminal
# desktop  = Nur Desktop-Notification (kein Fallback)
# terminal = Nur Terminal-Meldung
# off      = Keine Benachrichtigungen
_BREW_CHECK_NOTIFY=auto

# Benachrichtigungs-Titel und Meldung
# {count} wird durch die Anzahl veralteter Pakete ersetzt
_BREW_CHECK_TITLE='🍺 Homebrew'
_BREW_CHECK_MESSAGE='{count} Updates verfügbar – Zeit für brew-up'

# Mac App Store IDs gegen den Store prüfen: on | off
# Apple zieht Listings zurück (z.B. iWork 2026), die ID im Brewfile wird
# dadurch ungültig und die App bekommt still keine Updates mehr.
_BREW_CHECK_MAS_IDS=on

# {count} wird durch die Anzahl ungültiger IDs ersetzt
# Die Handlungsempfehlung steht je Eintrag dahinter: "ID ... ungültig" betrifft
# das Brewfile, "nicht deklariert" eine installierte App ohne Eintrag.
_BREW_CHECK_MAS_TITLE=' Mac App Store'
_BREW_CHECK_MAS_MESSAGE='{count} ohne Store-Eintrag'

# Store-Region als ISO-Code (z.B. de, us, gb)
# Leer = effektive Storefront von 'mas config --json'. Die kennt auch Regionen
# ohne eigenen Store (Liechtenstein liefert CH). Eine falsche Region meldet
# regional verfügbare Apps fälschlich als zurückgezogen.
_BREW_CHECK_MAS_REGION=''
